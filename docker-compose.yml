name: containertestimage

services:
  containertestimage:
    image: demoacr.azurecr.io/containertestimage:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUGET_PAT: ${DEMO_NUGET_PAT} # Pass the environment variable as the build argument
    restart: always
    container_name: containertestimage-1
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5024
      - Logging__LogLevel__Microsoft=Debug
      - Logging__LogLevel__Default=Debug
    ports: 
      - 5024:5024
      - 2224:2222
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - demo_common_network
networks:
  demo_common_network:
    name: demo_common_network
    external: true
volumes:
  kestrel_certificate: {}    
